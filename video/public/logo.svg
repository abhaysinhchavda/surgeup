<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SurgeUp">
  <defs>
    <linearGradient id="su-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#1b1ea9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#su-bg)"/>
  <!-- the queue: bids rising left to right -->
  <rect x="11" y="39" width="9" height="13" rx="2.5" fill="#fff" fill-opacity=".45"/>
  <rect x="24" y="31" width="9" height="21" rx="2.5" fill="#fff" fill-opacity=".7"/>
  <!-- the job that surges up and out of the line -->
  <path d="M41.5 52V20" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <path d="M31 25.5 41.5 13 52 25.5" fill="none" stroke="#ffd54a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
